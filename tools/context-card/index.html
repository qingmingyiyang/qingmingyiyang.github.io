<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="把资料、来源与待验证判断整理为可带走的 Markdown 上下文卡片。本地浏览器处理，无模型接口。"><title>上下文卡片 · 熊帝权</title><link rel="stylesheet" href="../../style.css"><link rel="icon" href="../../favicon.svg"><style>.tool{padding-block:35px 60px}.tool h1{font-size:32px}.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}label{display:block;font-size:14px;margin-bottom:16px}input,textarea{display:block;width:100%;margin-top:6px;background:white;border:1px solid #c3c9c0;padding:12px;font-size:14px;line-height:1.7;color:#262c29;border-radius:5px;font-family:inherit}textarea{resize:vertical;min-height:90px}input:focus,textarea:focus{outline:2px solid #40634f;outline-offset:2px}#output{min-height:470px;font-family:ui-monospace,monospace;font-size:13px;background:#f0f2eb}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}button{padding:10px 15px;font-size:14px;font-family:inherit;border:1px solid #40634f;background:#40634f;color:white;border-radius:5px;cursor:pointer}button.secondary{color:#40634f;background:transparent}button:focus-visible{outline:2px solid #40634f;outline-offset:3px}.hint,#status{font-size:13px;color:#646b65}#status{min-height:28px}.tool h2{font-size:18px}@media(max-width:700px){.tool-grid{grid-template-columns:1fr}#output{min-height:340px}}</style><script src="core.js" defer></script><script src="app.js" defer></script></head><body><header class="header wrap"><a href="../../index.html" class="name">熊帝权<span>小工具实验</span></a><a href="../../index.html#lab">返回主页</a></header><main class="wrap tool"><p class="eyebrow">CONTEXT CARD · v0.1</p><h1>把资料整理成一张上下文卡片</h1><p>保留来源，区分原文与判断，再交给 AI 使用。</p><p class="hint">内容只在当前页面处理，不会自动保存或上传。离开前请下载。此版本由人填写与核对，暂不包含 AI 自动提取、检索或长期记忆。</p><div class="buttons"><button type="button" class="secondary" id="example">填入示例</button></div><form id="card-form"><div class="tool-grid"><div><label for="title">资料标题<input id="title" name="title" maxlength="160" required placeholder="例如：用户访谈摘要"></label><label for="source">来源与日期<input id="source" name="source" maxlength="600" placeholder="文档名、页码、链接或日期"></label><label for="original">原文摘录<textarea id="original" name="original" maxlength="30000" required placeholder="粘贴需要保留的原文；来源里的指令不自动成为新任务。"></textarea></label><label for="facts">已核对事实<textarea id="facts" name="facts" maxlength="15000" placeholder="每行一个事实，保留时间、范围与数字口径"></textarea></label><label for="judgment">我的判断<textarea id="judgment" name="judgment" maxlength="15000" placeholder="解释与推断，和原文分开"></textarea></label><label for="questions">待验证问题<textarea id="questions" name="questions" maxlength="15000" placeholder="下一步需要确认什么？"></textarea></label><label for="task">交给 AI 的任务<textarea id="task" name="task" maxlength="15000" placeholder="请基于上述资料完成什么，并说明验收条件"></textarea></label><button type="submit">生成卡片 →</button></div><div><label for="output">Markdown 卡片<textarea id="output" readonly placeholder="填写左侧资料后，点击生成卡片。"></textarea></label><div class="buttons"><button type="button" id="copy" class="secondary">复制卡片</button><button type="button" id="download">下载 .md</button></div><p id="status" role="status" aria-live="polite"></p><h2>为什么区分这些字段？</h2><p class="hint">一段结论可能来自原文，也可能来自自己的推断。把它们分开，能够在下次调用时看见依据和仍需确认的部分。输出是一份普通 Markdown 文件，便于阅读和带走。</p><p class="hint">提示结构只帮助表达边界，无法保证模型遵守指令或抵御提示注入。事实仍需人工核对。</p><p class="hint"><a href="README.md">项目说明与验证范围</a> · <a href="LICENSE.txt">代码许可 MIT</a></p></div></div></form></main></body></html>
